<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NOVE Project</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Фон: CSS-градиент + сетка. Картинка (если задана в config.js) подставляется сверху из JS,
     и только после того, как реально загрузилась — битой картинки больше не будет. -->
<div id="background"></div>
<div id="backgroundImage"></div>
<div id="overlay"></div>

<div id="content">

    <div id="logoWrap">

        <!-- Встроенный SVG-логотип. Работает всегда, файлов не требует.
             Если в config.js указан logo — сюда подставится <img>, но только при успешной загрузке. -->
        <svg id="logoMark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="NOVE">
            <defs>
                <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop class="gradStop1" offset="0"></stop>
                    <stop class="gradStop2" offset="1"></stop>
                </linearGradient>
            </defs>
            <circle class="ring" cx="60" cy="60" r="53"></circle>
            <circle class="disc" cx="60" cy="60" r="45"></circle>
            <path class="letter" d="M43 83 V37 L77 83 V37"></path>
            <path class="rail" d="M31 97 H89"></path>
        </svg>

    </div>

    <h1 id="serverName">NOVE PROJECT</h1>

    <p id="subtitle">Добро пожаловать.</p>

    <div id="serverMeta">
        <span class="metaItem" id="metaMap" hidden></span>
        <span class="metaItem" id="metaGamemode" hidden></span>
        <span class="metaItem" id="metaPlayers" hidden></span>
    </div>

</div>


<div id="loadingPanel">

    <div id="statusRow">
        <div id="status">Подключение к серверу...</div>
        <div id="percent">—</div>
    </div>

    <div id="bar" class="indeterminate">
        <div id="progress"><div id="shine"></div></div>
    </div>

    <div id="detailRow">
        <div id="fileCount"></div>
    </div>

</div>


<div id="news">

    <div class="title">Новости</div>

    <ul id="newsList"></ul>

</div>


<div id="footer">

    <div id="version">
        <strong id="footerName">NOVE Project</strong>
        <br>
        <span id="footerVersion">Version 1.0</span>
    </div>

    <div id="tip">Совет: Соблюдайте интервалы движения.</div>

    <div id="links"></div>

</div>

<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
